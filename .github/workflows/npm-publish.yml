name: Publish

on:
  push:
    tags:
      - 'v*.*.*'        # fires on tags like v1.0.0, v1.2.3, etc.
  workflow_dispatch:    # also allow manual runs from the Actions tab

permissions:
  contents: write       # needed to create the GitHub release
  id-token: write       # required for Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      # Trusted Publishing (OIDC) needs npm >= 11.5.1.
      # Node 20 ships with npm 10.x, which falls back to token auth.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm test --if-present

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true